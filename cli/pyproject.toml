[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc"
version = "0.1.0"
description = "CLI wrapper for ai-sdlc-workflow — init workspaces and watch the agent office UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai-sdlc-workflow" }]
dependencies = []

[project.scripts]
ai-sdlc = "ai_sdlc_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_sdlc_cli*"]

[tool.setuptools.package-data]
ai_sdlc_cli = ["static/*"]
